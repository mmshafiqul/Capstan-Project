apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-service
  namespace: urlshortner
  labels:
    app: python-service
    component: analytics-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: python-service
  template:
    metadata:
      labels:
        app: python-service
        component: analytics-dashboard
    spec:
      containers:
      - name: python-service
        image: your-dockerhub-username/python-service:latest
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: python-service-config
        - secretRef:
            name: python-service-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: python-data
          mountPath: /app/data
      volumes:
      - name: python-data
        persistentVolumeClaim:
          claimName: python-service-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: python-service
  namespace: urlshortner
  labels:
    app: python-service
    component: analytics-dashboard
spec:
  selector:
    app: python-service
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: python-service-pvc
  namespace: urlshortner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 5Gi
