apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service
  namespace: urlshortner
  labels:
    app: go-service
    component: url-shortener
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: go-service
  template:
    metadata:
      labels:
        app: go-service
        component: url-shortener
    spec:
      containers:
      - name: go-service
        image: mmshafiqul/go-service:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: go-service-config
        - secretRef:
            name: go-service-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: go-data
          mountPath: /app/data
      volumes:
      - name: go-data
        persistentVolumeClaim:
          claimName: go-service-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: go-service
  namespace: urlshortner
  labels:
    app: go-service
    component: url-shortener
spec:
  selector:
    app: go-service
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-service-pvc
  namespace: urlshortner
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 5Gi
