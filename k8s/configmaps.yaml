apiVersion: v1
kind: ConfigMap
metadata:
  name: go-service-config
  namespace: urlshortner
data:
  LOG_LEVEL: "info"
  PORT: "8000"
  REDIS_URL: "redis:6379"
  PYTHON_SERVICE_URL: "http://python-service:5000"
  REDIS_MAX_RETRIES: "3"
  REDIS_POOL_SIZE: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: python-service-config
  namespace: urlshortner
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "5000"
  GO_SERVICE_URL: "http://go-service:8000"
  NODE_SERVICE_URL: "http://node-service:3000"
  REDIS_URL: "redis:6379"
  REDIS_CHANNEL: "click_events"
  REDIS_MAX_RETRIES: "3"
  DASHBOARD_REFRESH_INTERVAL: "5"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-service-config
  namespace: urlshortner
data:
  LOG_LEVEL: "info"
  PORT: "3000"
  METADATA_TIMEOUT: "10"
  MAX_REDIRECTS: "5"
  USER_AGENT: "URLShortner-Metadata/1.0"
